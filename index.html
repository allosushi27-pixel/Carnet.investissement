<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Carnet d'investissement — Allo Sushi</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --accent: #4F46E5; --accent-soft: #EEF2FF;
  --bg: #F6F7F9; --card: #FFFFFF; --border: #E5E7EB;
  --text: #111827; --text-soft: #6B7280;
  --success: #059669; --success-soft: #ECFDF5;
  --danger: #DC2626; --danger-soft: #FEF2F2;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); }
body {
  font-family: 'Inter', system-ui, sans-serif;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  transition: background 0.25s ease, color 0.25s ease;
}
#root { padding: 36px 18px 56px; max-width: 980px; margin: 0 auto; }

.invx-header { max-width: 760px; margin: 0 auto 28px; position: relative; }
.invx-header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.invx-logo-mark {
  width: 38px; height: 38px; border-radius: 10px; background: var(--accent);
  display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 15px;
}
.invx-settings-toggle {
  width: 36px; height: 36px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--card); color: var(--text-soft);
  font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.invx-settings-toggle:hover { color: var(--text); border-color: var(--text-soft); }
.invx-title { font-weight: 800; font-size: clamp(24px, 3.6vw, 32px); margin: 0 0 6px; letter-spacing: -0.02em; }
.invx-subtitle { color: var(--text-soft); font-size: 14px; margin: 0; line-height: 1.5; }

.invx-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 760px; margin: 0 auto 28px; }
.invx-summary-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 16px 14px; display: flex; flex-direction: column; gap: 6px;
  box-shadow: 0 1px 2px rgba(16,24,40,0.04);
}
.invx-summary-label { font-size: 11.5px; font-weight: 600; color: var(--text-soft); }
.invx-summary-value { font-weight: 700; font-size: 18px; }
.invx-accent { color: var(--accent); } .invx-danger { color: var(--danger); } .invx-success { color: var(--success); }

.invx-ledger { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }

.invx-card {
  position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 20px 20px 18px; box-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 1px 3px rgba(16,24,40,0.06);
}
.invx-stamp {
  position: absolute; top: 18px; right: 18px; padding: 4px 10px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 12px;
  box-shadow: 0 0 20px -6px var(--accent);
}

.invx-card-head { display: flex; align-items: baseline; gap: 10px; padding-right: 64px; margin-bottom: 16px; }
.invx-name { font-size: 18px; font-weight: 700; margin: 0; cursor: text; border-bottom: 1px dashed transparent; }
.invx-name:hover { border-bottom-color: var(--border); }
.invx-name-input { font-size: 18px; font-weight: 700; background: transparent; border: none; border-bottom: 1.5px solid var(--accent); padding: 0; width: 100%; color: var(--text); font-family: inherit; }
.invx-name-input:focus { outline: none; }
.invx-remove-partner { background: none; border: none; color: var(--text-soft); font-size: 11.5px; cursor: pointer; text-decoration: underline; white-space: nowrap; }

.invx-progress-track { height: 7px; background: var(--bg); border-radius: 999px; margin-bottom: 16px; overflow: hidden; }
.invx-progress-fill { height: 100%; background: var(--success); transition: width 0.4s ease; border-radius: 999px; }
.invx-progress-over { background: var(--danger); }

.invx-mini-stats { display: flex; justify-content: space-between; margin-bottom: 18px; gap: 10px; flex-wrap: wrap; }
.invx-mini-stats > div { display: flex; flex-direction: column; gap: 3px; }
.invx-field-label { font-size: 11px; font-weight: 600; color: var(--text-soft); }
.invx-mini-stats .invx-mono { font-size: 14.5px; font-weight: 700; }

.invx-card-tabs { display: flex; gap: 2px; margin-bottom: 14px; background: var(--bg); border-radius: 10px; padding: 3px; }
.invx-card-tab { flex: 1; background: none; border: none; padding: 8px 6px; border-radius: 8px; font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--text-soft); cursor: pointer; }
.invx-card-tab-active { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(16,24,40,0.08); }
.invx-card-tab-active.invx-tab-apports { color: var(--success); }
.invx-card-tab-active.invx-tab-retraits { color: var(--danger); }

.invx-form { padding-top: 2px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 8px; }
.invx-form-row { display: flex; gap: 8px; }
.invx-form-row input[type="date"], .invx-form-row input[type="number"], .invx-form-row input[type="text"] {
  flex: 1; min-width: 0; font-family: inherit; font-size: 13.5px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text);
}
.invx-form-row input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.invx-add-btn { font-family: inherit; font-size: 13px; font-weight: 600; background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 8px 16px; cursor: pointer; white-space: nowrap; box-shadow: 0 4px 14px -6px var(--accent); }
.invx-add-btn.invx-add-apports { background: var(--success); }
.invx-add-btn.invx-add-retraits { background: var(--danger); }
.invx-add-btn:hover { opacity: 0.9; }

.invx-empty { color: var(--text-soft); font-size: 13px; margin: 0; }
.invx-list { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow-y: auto; }
.invx-list-row { display: grid; grid-template-columns: 72px 1fr 18px; grid-template-areas: "date amount del" "note note del"; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.invx-list-row:last-child { border-bottom: none; }
.invx-list-date { grid-area: date; color: var(--text-soft); font-size: 11.5px; font-weight: 500; }
.invx-list-amount { grid-area: amount; text-align: right; font-size: 13.5px; font-weight: 600; }
.invx-list-note { grid-area: note; color: var(--text-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.invx-delete-btn { grid-area: del; background: none; border: none; color: var(--text-soft); font-size: 16px; line-height: 1; cursor: pointer; opacity: 0.5; }
.invx-delete-btn:hover { opacity: 1; color: var(--danger); }

.invx-footer { margin: 28px auto 0; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.invx-ghost-btn { background: var(--card); border: 1px solid var(--border); border-radius: 10px; color: var(--text-soft); font-family: inherit; font-size: 13px; font-weight: 600; padding: 9px 16px; cursor: pointer; }
.invx-ghost-btn:hover { border-color: var(--text-soft); color: var(--text); }

.invx-modal-overlay { position: fixed; inset: 0; background: rgba(17,24,39,0.5); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
.invx-modal { background: var(--card); border-radius: 18px; max-width: 480px; width: 100%; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(17,24,39,0.25); overflow: hidden; }
.invx-modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--border); }
.invx-modal-title { font-size: 17px; font-weight: 700; margin: 0; }
.invx-modal-close { background: none; border: none; font-size: 20px; color: var(--text-soft); cursor: pointer; line-height: 1; }
.invx-modal-close:hover { color: var(--danger); }

.invx-tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 8px; }
.invx-tab { flex: 1; background: none; border: none; padding: 12px 8px; font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--text-soft); cursor: pointer; border-bottom: 2px solid transparent; }
.invx-tab:hover { color: var(--text); }
.invx-tab-active { color: var(--accent); border-bottom-color: var(--accent); }
.invx-tab-danger.invx-tab-active { color: var(--danger); border-bottom-color: var(--danger); }
.invx-tab-body { padding: 20px; overflow-y: auto; }

.invx-theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.invx-theme-option { display: flex; align-items: center; gap: 9px; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; width: 100%; text-align: left; }
.invx-theme-option:hover { border-color: var(--text-soft); }
.invx-theme-active { outline: 2px solid var(--accent); outline-offset: -1px; }
.invx-theme-swatch { width: 16px; height: 16px; border-radius: 999px; flex-shrink: 0; }

.invx-history-full { max-height: 340px; }
.invx-list-row-full { grid-template-columns: 64px 74px 90px 1fr auto; grid-template-areas: "date type partner amount note"; font-size: 12px; }
.invx-list-type { grid-area: type; font-size: 10.5px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; }
.invx-list-type.apport { color: var(--success); }
.invx-list-type.retrait { color: var(--danger); }
.invx-list-partner { grid-area: partner; color: var(--text-soft); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.invx-list-row-full .invx-list-amount { grid-area: amount; }
.invx-list-row-full .invx-list-note { grid-area: note; white-space: normal; font-size: 12px; }

.invx-danger-panel { padding: 0; }
.invx-danger-text { font-size: 12.5px; color: var(--text-soft); line-height: 1.5; margin: 0 0 12px; }
.invx-danger-text strong { color: var(--danger); }
.invx-danger-row { display: flex; gap: 8px; flex-wrap: wrap; }
.invx-danger-input { font-family: inherit; font-size: 13px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); width: 140px; }
.invx-danger-error { color: var(--danger); font-size: 12px; margin-top: 8px; }
.invx-danger-confirm { font-family: inherit; font-size: 13px; font-weight: 600; background: var(--danger); color: #fff; border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
.invx-danger-confirm:hover { opacity: 0.9; }

.invx-storage-note { text-align:center; font-size: 11.5px; color: var(--text-soft); margin-top: 36px; }

@media (max-width: 640px) {
  #root { padding: 24px 14px 44px; }
  .invx-summary { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="root"></div>

<script>
const STORAGE_KEY = "invest-ledger-autonome-v2";

const THEMES = {
  indigo:  { label: "Indigo",   swatch: "#4F46E5", accent:"#4F46E5", accentSoft:"#EEF2FF", bg:"#F6F7F9", card:"#FFFFFF", border:"#E5E7EB", text:"#111827", textSoft:"#6B7280", success:"#059669", successSoft:"#ECFDF5", danger:"#DC2626", dangerSoft:"#FEF2F2" },
  emerald: { label: "Émeraude", swatch: "#059669", accent:"#059669", accentSoft:"#ECFDF5", bg:"#F6F7F9", card:"#FFFFFF", border:"#E5E7EB", text:"#111827", textSoft:"#6B7280", success:"#0D9488", successSoft:"#F0FDFA", danger:"#DC2626", dangerSoft:"#FEF2F2" },
  slate:   { label: "Ardoise",  swatch: "#475569", accent:"#475569", accentSoft:"#F1F5F9", bg:"#F6F7F9", card:"#FFFFFF", border:"#E5E7EB", text:"#111827", textSoft:"#6B7280", success:"#059669", successSoft:"#ECFDF5", danger:"#B91C1C", dangerSoft:"#FEF2F2" },
  dark:    { label: "Sombre",   swatch: "#6366F1", accent:"#818CF8", accentSoft:"#312E81", bg:"#0F172A", card:"#1E293B", border:"#334155", text:"#F1F5F9", textSoft:"#94A3B8", success:"#34D399", successSoft:"#064E3B", danger:"#F87171", dangerSoft:"#450A0A" },
  nova:    { label: "Nova (tech)", swatch: "#3B82F6", accent:"#3B82F6", accentSoft:"#15234A", bg:"#0A0E27", card:"#101836", border:"#1F2B4D", text:"#E7ECFA", textSoft:"#8C97B8", success:"#22D3A5", successSoft:"#062E29", danger:"#F87171", dangerSoft:"#3B0F14" },
};

const uid = () => Math.random().toString(36).slice(2, 10);
const todayISO = () => new Date().toISOString().slice(0, 10);

function defaultData() {
  return {
    restaurantName: "Allo Sushi",
    theme: "indigo",
    partners: [
      { id: uid(), name: "Toi", apports: [], withdrawals: [] },
      { id: uid(), name: "Ton oncle", apports: [], withdrawals: [] },
    ],
  };
}

function migratePartner(p) {
  if (!p.apports) {
    p.apports = (p.engaged && Number(p.engaged) > 0)
      ? [{ id: uid(), date: todayISO(), amount: Number(p.engaged), note: "Apport initial" }]
      : [];
  }
  if (!p.withdrawals) p.withdrawals = [];
  delete p.engaged;
  return p;
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      parsed.partners = (parsed.partners || []).map(migratePartner);
      if (!THEMES[parsed.theme]) parsed.theme = "indigo";
      return parsed;
    }
  } catch (e) {}
  return defaultData();
}

function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { console.error("Sauvegarde impossible :", e); }
}

function formatDA(n) {
  const v = Math.round(Number(n) || 0);
  return `${v.toLocaleString("fr-FR")} DA`;
}
function formatDateFR(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function totalApports(p) { return p.apports.reduce((s, a) => s + (Number(a.amount) || 0), 0); }
function totalWithdrawn(p) { return p.withdrawals.reduce((s, w) => s + (Number(w.amount) || 0), 0); }
function esc(str) {
  return String(str || "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

let state = loadData();
let ui = {
  settingsOpen: false, settingsTab: "appearance", editingNameFor: null, resetError: false, cardTab: {},
};
function getCardTab(id) { return ui.cardTab[id] || "apports"; }

function applyTheme() {
  const t = THEMES[state.theme] || THEMES.indigo;
  const root = document.documentElement;
  root.style.setProperty("--accent", t.accent);
  root.style.setProperty("--accent-soft", t.accentSoft);
  root.style.setProperty("--bg", t.bg);
  root.style.setProperty("--card", t.card);
  root.style.setProperty("--border", t.border);
  root.style.setProperty("--text", t.text);
  root.style.setProperty("--text-soft", t.textSoft);
  root.style.setProperty("--success", t.success);
  root.style.setProperty("--success-soft", t.successSoft);
  root.style.setProperty("--danger", t.danger);
  root.style.setProperty("--danger-soft", t.dangerSoft);
}

function render() {
  applyTheme();
  const totalEngaged = state.partners.reduce((s, p) => s + totalApports(p), 0);
  const totalOut = state.partners.reduce((s, p) => s + totalWithdrawn(p), 0);
  const totalRemaining = totalEngaged - totalOut;

  const summaryHTML = `
    <section class="invx-summary">
      <div class="invx-summary-card">
        <span class="invx-summary-label">Total engagé</span>
        <span class="invx-summary-value invx-accent">${formatDA(totalEngaged)}</span>
      </div>
      <div class="invx-summary-card">
        <span class="invx-summary-label">Total prélevé</span>
        <span class="invx-summary-value invx-danger">${formatDA(totalOut)}</span>
      </div>
      <div class="invx-summary-card">
        <span class="invx-summary-label">Reste à récupérer</span>
        <span class="invx-summary-value ${totalRemaining < 0 ? "invx-danger" : "invx-success"}">
          ${formatDA(Math.abs(totalRemaining))}${totalRemaining < 0 ? " en trop" : ""}
        </span>
      </div>
    </section>`;

  const cardsHTML = state.partners.map((p) => partnerCardHTML(p)).join("");
  const settingsHTML = ui.settingsOpen ? settingsModalHTML() : "";

  document.getElementById("root").innerHTML = `
    <header class="invx-header">
      <div class="invx-header-top">
        <div class="invx-logo-mark">AS</div>
        <button class="invx-settings-toggle" data-action="open-settings" title="Paramètres">⚙</button>
      </div>
      <h1 class="invx-title">Carnet d'investissement — ${esc(state.restaurantName)}</h1>
      <p class="invx-subtitle">Apports engagés et prélèvements de chaque associé, pour suivre ce qu'il reste à récupérer.</p>
    </header>
    ${summaryHTML}
    <section class="invx-ledger">${cardsHTML}</section>
    <footer class="invx-footer">
      <button class="invx-ghost-btn" data-action="add-partner">+ Ajouter un associé</button>
    </footer>
    <p class="invx-storage-note">Données enregistrées uniquement sur cet appareil, dans ce navigateur.</p>
    ${settingsHTML}
  `;
}

function partnerCardHTML(p) {
  const engaged = totalApports(p);
  const withdrawn = totalWithdrawn(p);
  const remaining = engaged - withdrawn;
  const pct = engaged > 0 ? Math.min(100, Math.round((withdrawn / engaged) * 100)) : 0;
  const overrun = engaged > 0 && withdrawn > engaged;
  const tab = getCardTab(p.id);

  const nameHTML = ui.editingNameFor === p.id
    ? `<input class="invx-name-input" data-role="name-input" data-id="${p.id}" value="${esc(p.name)}" />`
    : `<h2 class="invx-name" data-action="edit-name" data-id="${p.id}">${esc(p.name)}</h2>`;

  const removeBtn = state.partners.length > 2
    ? `<button class="invx-remove-partner" data-action="remove-partner" data-id="${p.id}">retirer</button>` : "";

  const sortedApports = [...p.apports].sort((a, b) => b.date.localeCompare(a.date));
  const sortedWithdrawals = [...p.withdrawals].sort((a, b) => b.date.localeCompare(a.date));

  const apportsRows = sortedApports.length === 0
    ? `<p class="invx-empty">Aucun apport enregistré pour l'instant.</p>`
    : `<ul class="invx-list">${sortedApports.map((a) => `
        <li class="invx-list-row">
          <span class="invx-list-date">${formatDateFR(a.date)}</span>
          <span class="invx-list-amount invx-success">+ ${formatDA(a.amount)}</span>
          <span class="invx-list-note">${esc(a.note)}</span>
          <button class="invx-delete-btn" data-action="delete-apport" data-id="${p.id}" data-wid="${a.id}" aria-label="Supprimer">×</button>
        </li>`).join("")}</ul>`;

  const retraitsRows = sortedWithdrawals.length === 0
    ? `<p class="invx-empty">Aucun prélèvement enregistré pour l'instant.</p>`
    : `<ul class="invx-list">${sortedWithdrawals.map((w) => `
        <li class="invx-list-row">
          <span class="invx-list-date">${formatDateFR(w.date)}</span>
          <span class="invx-list-amount invx-danger">− ${formatDA(w.amount)}</span>
          <span class="invx-list-note">${esc(w.note)}</span>
          <button class="invx-delete-btn" data-action="delete-withdrawal" data-id="${p.id}" data-wid="${w.id}" aria-label="Supprimer">×</button>
        </li>`).join("")}</ul>`;

  const apportsSection = `
    <form class="invx-form" data-role="apport-form" data-id="${p.id}">
      <div class="invx-form-row">
        <input type="date" name="date" value="${todayISO()}" required />
        <input type="number" name="amount" min="0" placeholder="Montant" required />
      </div>
      <div class="invx-form-row">
        <input type="text" name="note" placeholder="Note (ex: 2ᵉ apport)" />
        <button type="submit" class="invx-add-btn invx-add-apports">Ajouter l'apport</button>
      </div>
    </form>
    <div class="invx-history">${apportsRows}</div>`;

  const retraitsSection = `
    <form class="invx-form" data-role="withdrawal-form" data-id="${p.id}">
      <div class="invx-form-row">
        <input type="date" name="date" value="${todayISO()}" required />
        <input type="number" name="amount" min="0" placeholder="Montant" required />
      </div>
      <div class="invx-form-row">
        <input type="text" name="note" placeholder="Note (facultatif)" />
        <button type="submit" class="invx-add-btn invx-add-retraits">Enregistrer</button>
      </div>
    </form>
    <div class="invx-history">${retraitsRows}</div>`;

  return `
    <article class="invx-card">
      <div class="invx-stamp">${pct}%</div>
      <div class="invx-card-head">${nameHTML}${removeBtn}</div>

      <div class="invx-progress-track">
        <div class="invx-progress-fill ${overrun ? "invx-progress-over" : ""}" style="width:${pct}%"></div>
      </div>
      <div class="invx-mini-stats">
        <div><span class="invx-field-label">Apporté</span><span class="invx-mono invx-accent">${formatDA(engaged)}</span></div>
        <div><span class="invx-field-label">Prélevé</span><span class="invx-mono invx-danger">${formatDA(withdrawn)}</span></div>
        <div>
          <span class="invx-field-label">${remaining < 0 ? "Surplus" : "Reste"}</span>
          <span class="invx-mono ${remaining < 0 ? "invx-danger" : "invx-success"}">${formatDA(Math.abs(remaining))}</span>
        </div>
      </div>

      <div class="invx-card-tabs">
        <button class="invx-card-tab invx-tab-apports ${tab === "apports" ? "invx-card-tab-active" : ""}" data-action="set-card-tab" data-id="${p.id}" data-cardtab="apports">Apports (${p.apports.length})</button>
        <button class="invx-card-tab invx-tab-retraits ${tab === "retraits" ? "invx-card-tab-active" : ""}" data-action="set-card-tab" data-id="${p.id}" data-cardtab="retraits">Prélèvements (${p.withdrawals.length})</button>
      </div>

      ${tab === "apports" ? apportsSection : retraitsSection}
    </article>`;
}

function settingsModalHTML() {
  const tab = ui.settingsTab;
  let body = "";

  if (tab === "appearance") {
    body = `<div class="invx-theme-grid">
      ${Object.entries(THEMES).map(([key, t]) => `
        <button class="invx-theme-option ${state.theme === key ? "invx-theme-active" : ""}" data-action="set-theme" data-theme="${key}">
          <span class="invx-theme-swatch" style="background:${t.swatch}"></span>${t.label}
        </button>`).join("")}
    </div>`;
  } else if (tab === "history") {
    const allApports = state.partners.flatMap((p) => p.apports.map((a) => ({ ...a, partnerName: p.name, type: "apport" })));
    const allRetraits = state.partners.flatMap((p) => p.withdrawals.map((w) => ({ ...w, partnerName: p.name, type: "retrait" })));
    const all = [...allApports, ...allRetraits].sort((a, b) => b.date.localeCompare(a.date));
    body = all.length === 0
      ? `<p class="invx-empty">Aucun mouvement enregistré pour l'instant.</p>`
      : `<div class="invx-history-full"><ul class="invx-list">${all.map((w) => `
          <li class="invx-list-row invx-list-row-full">
            <span class="invx-list-date">${formatDateFR(w.date)}</span>
            <span class="invx-list-type ${w.type}">${w.type === "apport" ? "Apport" : "Retrait"}</span>
            <span class="invx-list-partner">${esc(w.partnerName)}</span>
            <span class="invx-list-amount ${w.type === "apport" ? "invx-success" : "invx-danger"}">${w.type === "apport" ? "+" : "−"} ${formatDA(w.amount)}</span>
            <span class="invx-list-note">${esc(w.note)}</span>
          </li>`).join("")}</ul></div>`;
  } else if (tab === "danger") {
    body = `<div class="invx-danger-panel">
      <p class="invx-danger-text">Ceci efface définitivement les associés, les apports et tous les prélèvements enregistrés sur cet appareil. Tape <strong>SUPPRIMER</strong> ci-dessous pour confirmer.</p>
      <div class="invx-danger-row">
        <input type="text" class="invx-danger-input" id="reset-confirm-input" placeholder="SUPPRIMER" />
        <button class="invx-danger-confirm" data-action="confirm-reset">Effacer le carnet</button>
      </div>
      ${ui.resetError ? `<p class="invx-danger-error">Le mot tapé ne correspond pas à "SUPPRIMER".</p>` : ""}
    </div>`;
  }

  return `
    <div class="invx-modal-overlay" data-action="close-settings">
      <div class="invx-modal" data-stop="1">
        <div class="invx-modal-head">
          <h3 class="invx-modal-title">Paramètres</h3>
          <button class="invx-modal-close" data-action="close-settings" aria-label="Fermer">×</button>
        </div>
        <div class="invx-tabs">
          <button class="invx-tab ${tab === "appearance" ? "invx-tab-active" : ""}" data-action="set-tab" data-tab="appearance">Apparence</button>
          <button class="invx-tab ${tab === "history" ? "invx-tab-active" : ""}" data-action="set-tab" data-tab="history">Historique complet</button>
          <button class="invx-tab invx-tab-danger ${tab === "danger" ? "invx-tab-active" : ""}" data-action="set-tab" data-tab="danger">Zone sensible</button>
        </div>
        <div class="invx-tab-body">${body}</div>
      </div>
    </div>`;
}

function onClick(e) {
  const overlay = e.target.closest("[data-action='close-settings']");
  if (overlay && !e.target.closest("[data-stop]")) {
    ui.settingsOpen = false; ui.settingsTab = "appearance"; ui.resetError = false; render(); return;
  }
  const modalInner = e.target.closest(".invx-modal");
  if (modalInner && e.target.closest("[data-action='close-settings']")) {
    ui.settingsOpen = false; ui.settingsTab = "appearance"; ui.resetError = false; render(); return;
  }

  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;

  if (action === "open-settings") { ui.settingsOpen = true; render(); }
  else if (action === "add-partner") {
    state.partners.push({ id: uid(), name: `Associé ${state.partners.length + 1}`, apports: [], withdrawals: [] });
    saveData(); render();
  }
  else if (action === "remove-partner") {
    state.partners = state.partners.filter((p) => p.id !== btn.dataset.id);
    saveData(); render();
  }
  else if (action === "edit-name") {
    ui.editingNameFor = btn.dataset.id; render();
    const input = document.querySelector(`[data-role="name-input"][data-id="${btn.dataset.id}"]`);
    if (input) { input.focus(); input.select(); }
  }
  else if (action === "set-card-tab") { ui.cardTab[btn.dataset.id] = btn.dataset.cardtab; render(); }
  else if (action === "delete-apport") {
    const p = state.partners.find((x) => x.id === btn.dataset.id);
    if (p) p.apports = p.apports.filter((a) => a.id !== btn.dataset.wid);
    saveData(); render();
  }
  else if (action === "delete-withdrawal") {
    const p = state.partners.find((x) => x.id === btn.dataset.id);
    if (p) p.withdrawals = p.withdrawals.filter((w) => w.id !== btn.dataset.wid);
    saveData(); render();
  }
  else if (action === "set-theme") { state.theme = btn.dataset.theme; saveData(); render(); }
  else if (action === "set-tab") { ui.settingsTab = btn.dataset.tab; ui.resetError = false; render(); }
  else if (action === "confirm-reset") {
    const input = document.getElementById("reset-confirm-input");
    const val = (input && input.value || "").trim().toUpperCase();
    if (val === "SUPPRIMER") {
      const keepTheme = state.theme;
      state = defaultData(); state.theme = keepTheme;
      ui.settingsOpen = false; ui.settingsTab = "appearance"; ui.resetError = false;
      saveData(); render();
    } else {
      ui.resetError = true; render();
      const again = document.getElementById("reset-confirm-input");
      if (again) again.focus();
    }
  }
}

function onSubmit(e) {
  const apportForm = e.target.closest("[data-role='apport-form']");
  if (apportForm) {
    e.preventDefault();
    const pid = apportForm.dataset.id;
    const fd = new FormData(apportForm);
    const amount = Number(fd.get("amount"));
    if (!amount || amount <= 0) return;
    const p = state.partners.find((x) => x.id === pid);
    if (p) { p.apports.unshift({ id: uid(), date: fd.get("date"), amount, note: (fd.get("note") || "").trim() }); saveData(); render(); }
    return;
  }
  const form = e.target.closest("[data-role='withdrawal-form']");
  if (!form) return;
  e.preventDefault();
  const pid = form.dataset.id;
  const fd = new FormData(form);
  const amount = Number(fd.get("amount"));
  if (!amount || amount <= 0) return;
  const p = state.partners.find((x) => x.id === pid);
  if (p) { p.withdrawals.unshift({ id: uid(), date: fd.get("date"), amount, note: (fd.get("note") || "").trim() }); saveData(); render(); }
}

function onFocusOut(e) {
  const nameInput = e.target.closest && e.target.closest("[data-role='name-input']");
  if (nameInput) {
    const p = state.partners.find((x) => x.id === nameInput.dataset.id);
    if (p) p.name = nameInput.value.trim() || p.name;
    ui.editingNameFor = null; saveData(); render();
  }
}

const rootEl = document.getElementById("root");
rootEl.addEventListener("click", onClick);
rootEl.addEventListener("submit", onSubmit);
rootEl.addEventListener("focusout", onFocusOut, true);

render();
</script>
</body>
</html>
